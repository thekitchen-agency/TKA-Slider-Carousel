<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKA Slider - Single with Rotate Slides</title>
    <link rel="stylesheet" href="dist/tka-slider-carousel.css">
    <style>
        :root {
            --bg-color: #e7e5e4;
            --text-color: #1c1917;
            --primary-rose: #e8a598;
            --primary-rose-hover: #df9182;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
            padding: 0 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.03em;
        }

        header p {
            color: #78716c;
            font-size: 1.1rem;
            margin: 0;
        }

        .slider-wrapper {
            position: relative;
            width: calc(100vw);
            margin: 0 auto;
            box-sizing: border-box;
            padding: 0;
        }

        .tka-slider {
            width: 100%;
            margin: 0 auto;
            overflow: visible;
            /* Crucial for seeing rotated side slides */
        }

        .demo-slide {
            height: 100% !important;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            color: white;
            position: relative;
            border-radius: 0 !important;
        }

        .demo-slide::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 60%);

            pointer-events: none;
            z-index: 1;
        }

        .demo-slide h3 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Controls outside the slider for clean clicking */
        .tka-controls {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .tka-controls button {
            pointer-events: auto !important;
            position: relative;
            z-index: 1000;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--primary-rose);
            border: none;
            color: #1c1917;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
        }

        .tka-controls button:hover {
            background-color: var(--primary-rose-hover);
            transform: scale(1.08);
        }

        .tka-controls button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <header>
        <h1>Single with Rotate Slides</h1>
        <p>A beautiful 2D circular path slider. The active slide stays flat and prominent in the center, while side
            slides are aligned along a 2D arc, scaled down, faded, and rotated.</p>
    </header>

    <div class="slider-wrapper">
        <div class="tka-slider" id="slider-single-rotate">
            <div class="tka-slider__track">
                <div class="tka-slider__slide">
                    <div class="demo-slide" style="background-image: url('images/interior_living_room.png');">
                        <h3>Minimalist Living Room</h3>
                    </div>
                </div>
                <div class="tka-slider__slide">
                    <div class="demo-slide" style="background-image: url('images/interior_kitchen.png');">
                        <h3>Sleek Kitchen</h3>
                    </div>
                </div>
                <div class="tka-slider__slide">
                    <div class="demo-slide" style="background-image: url('images/interior_bedroom.png');">
                        <h3>Contemporary Bedroom</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="tka-controls">
            <button data-tka-control="<">←</button>
            <button data-tka-control=">">→</button>
        </div>
    </div>


    <script type="importmap">
    {
        "imports": {
            "gsap": "https://esm.sh/gsap@3.12.5",
            "gsap/Draggable": "https://esm.sh/gsap@3.12.5/Draggable"
        }
    }
    </script>

    <script type="module">
        import gsap from 'gsap';
        import { Draggable } from 'gsap/Draggable';
        import Slider from './src/index.js';

        gsap.registerPlugin(Draggable);

        const slider = new Slider('#slider-single-rotate', {
            type: 'single-rotate',
            perView: 1.2,
            focusAt: 'center',
            loop: true,
            singleRotateRadius: 20500,
            singleRotateInvert: true,
            singleRotateScale: 1.0,
            singleRotateOpacity: 0.7,
            singleRotateShift: 0.0,
            animationDuration: 800,
            gap: 60,
        }).mount();
    </script>
</body>

</html>
